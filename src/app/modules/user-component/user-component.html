<div class="container-fluid vh-100 overflow-hidden p-0 bg-body-secondary text-body-emphasis">
    <div class="row g-0 h-100">

        <sidebar-component 
            class="col-xl-2 h-100 offcanvas-xl offcanvas-end" 
            id="sidebarMenu"
            tabindex="-1"
            data-bs-scroll="true"
            [parentRoute]="'user'" 
            [routeConfig]="routeConfig" 
        ></sidebar-component>
        
         
        <main class="col-xl-10 col-12 d-flex flex-column h-100 overflow-hidden">
            
            <header-component></header-component>

            <div class="flex-grow-1 overflow-auto p-2">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>
</div>
