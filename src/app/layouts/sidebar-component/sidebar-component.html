<aside class="offcanvas-lg offcanvas-end bg-dark text-white sidebar-wrapper d-flex flex-column h-100" id="sidebarMenu">
    
    <!--  Header (Fixed) -->
    <div class="offcanvas-header d-lg-none">
        <h5 class="offcanvas-title text-white">Menu</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
    </div>
    
    <!-- User Block (Fixed)-->
    <div class="user-block p-3 border-bottom border-white border-opacity-25 flex-shrink-0">
        <div class="d-flex align-items-center">
            <div class="flex-shrink-0">
                <div class="bg-light rounded-circle me-2" style="width: 60px; height: 60px;"></div>
            </div>
            <div class="flex-grow-1">
                <div class="fw-bold text-wrap small mb-0">Manish Kushwaha</div>
                <div class="small text-white-50" style="font-size: 0.75rem;">Administrator</div>
            </div>
        </div>
    </div>
    
    <!-- Navigation (Scrollable) -->
    <div class="sidebar-scroll flex-grow-1 small">
        <div class="sidebar-content p-3 accordion" id="accordionGroup">
            
            <ul class="list-group list-group-flush">

                <div class="rounded-3 mb-3 overflow-hidden" routerLinkActive="active-mode"
                    [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">

                    <a class="main-menu list-group-item list-group-item-action d-flex justify-content-between align-items-center" 
                        routerLink="./home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                        <span><i class="bi bi-house me-3"></i>Home</span>
                    </a>
                </div>

                <div class="rounded-3 mb-3 overflow-hidden" routerLinkActive="active-mode"
                    [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">

                    <a class="main-menu list-group-item list-group-item-action d-flex justify-content-between align-items-center collapsed" 
                        data-bs-toggle="collapse" href="#alert" [attr.aria-expanded]="alertCollapse.classList.contains('show')">
                        <span><i class="bi bi-bell me-3"></i>Alerts</span><i class="bi bi-chevron-down small"></i>
                    </a>

                    <div id="alert" class="collapse" #alertCollapse data-bs-parent="#accordionGroup" [routerLinkActive]="['show']">
                        <div class="list-group list-group-flush">

                            <a class="list-group-item list-group-item-action" routerLink="alert/live" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <span><i class="bi bi-activity me-3"></i>Alert Live</span>
                            </a>

                            <a class="list-group-item list-group-item-action" routerLink="alert/detail-report" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <span><i class="bi bi-file-earmark-bar-graph me-3"></i>Alert Detail Report</span>
                            </a>

                            <a class="list-group-item list-group-item-action" routerLink="alert/summary-report" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <span><i class="bi bi-collection-play me-3"></i>Alert Summary Report</span>
                            </a>

                        </div>
                    </div>
                </div>

                <div class="rounded-3 mb-3 overflow-hidden" routerLinkActive="active-mode"
                    [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">
                    
                    <a class="main-menu list-group-item list-group-item-action d-flex justify-content-between align-items-center collapsed" 
                        data-bs-toggle="collapse" href="#telemetry" [attr.aria-expanded]="telemetryCollapse.classList.contains('show')">
                        <span><i class="bi bi-graph-up me-3"></i>Telemetry</span><i class="bi bi-chevron-down small"></i>
                    </a>

                    <div id="telemetry" class="collapse" #telemetryCollapse data-bs-parent="#accordionGroup" [routerLinkActive]="['show']">
                        <div class="list-group list-group-flush">

                            <a class="list-group-item list-group-item-action" routerLink="telemetry/live" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <span><i class="bi bi-broadcast me-3"></i>Telemetry Live</span>
                            </a>

                            <a class="list-group-item list-group-item-action" routerLink="telemetry/history" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <span><i class="bi bi-clock-history me-3"></i>Telemetry History</span>
                            </a>

                        </div>
                    </div>
                </div>

                <div class="rounded-3 mb-3 overflow-hidden" routerLinkActive="active-mode"
                    [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">

                    <a class="main-menu list-group-item list-group-item-action d-flex justify-content-between align-items-center collapsed" 
                        data-bs-toggle="collapse" href="#sensor" [attr.aria-expanded]="sensorCollapse.classList.contains('show')">
                        <span><i class="bi bi-hdd-network me-3"></i>IOT/Sensor</span><i class="bi bi-chevron-down small"></i>
                    </a>

                    <div id="sensor" class="collapse" #sensorCollapse data-bs-parent="#accordionGroup" [routerLinkActive]="['show']">
                        <div class="list-group list-group-flush">

                            <a class="list-group-item list-group-item-action" routerLink="sensor/live" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <span><i class="bi bi-cpu me-3"></i>IOT/Sensor Live</span>
                            </a>

                            <a class="list-group-item list-group-item-action" routerLink="sensor/detail-report" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <span><i class="bi bi-file-earmark-medical me-3"></i>IOT/Sensor Detail Report</span>
                            </a>

                        </div>
                    </div>
                </div>

                <div class="rounded-3 mb-3 overflow-hidden" routerLinkActive="active-mode"
                    [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">

                    <a class="main-menu list-group-item list-group-item-action d-flex justify-content-between align-items-center collapsed" 
                        data-bs-toggle="collapse" href="#asset" [attr.aria-expanded]="assetCollapse.classList.contains('show')">
                        <span><i class="bi bi-tag me-3"></i>Asset</span><i class="bi bi-chevron-down small"></i>
                    </a>

                    <div id="asset" class="collapse" #assetCollapse data-bs-parent="#accordionGroup" [routerLinkActive]="['show']">
                        <div class="list-group list-group-flush">

                            <a class="list-group-item list-group-item-action" routerLink="asset/detail-report" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <span><i class="bi bi-journal-text me-3"></i>Asset Detail Report</span>
                            </a>

                            <a class="list-group-item list-group-item-action" routerLink="asset/utilization" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <span><i class="bi bi-bar-chart-steps me-3"></i>Asset Utilization</span>
                            </a>

                        </div>
                    </div>
                </div>                                                                                                                                                                                                                                                                                                                                                                                                                                                             

                <!-- Horizontal Fly-out Dropdown -->
                <!-- <div class="dropdown dropend position-static rounded-3 mb-3 overflow-hidden" routerLinkActive="active-mode"
                    [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">
                    
                    <a class="main-menu dropdown-link btn d-flex justify-content-between align-items-center px-3" href="#" data-bs-toggle="dropdown" data-bs-boundary="viewport">
                        <span><i class="bi bi-collection me-3"></i>Asset</span><i class="bi bi-chevron-right small"></i>
                    </a>
                    <ul class="dropdown-menu border-0 shadow">
                        <li><a class="dropdown-item" routerLink="asset/detail-report" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Asset Detail Report</a></li>
                        <li><a class="dropdown-item" routerLink="asset/utilization" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Asset Utilization</a></li>
                    </ul>
                </div> -->
                
            </ul>

        </div>
    </div>

     <!-- Logout Block (Fixed at bottom) -->
    <div class="p-3 border-top border-white border-opacity-10 mt-auto flex-shrink-0">
        <a class="list-group-item list-group-item-action d-flex align-items-center text-warning" routerLink="/login">
            <i class="bi bi-box-arrow-right me-3"></i> <span>Logout</span>
        </a>
    </div>

</aside>
