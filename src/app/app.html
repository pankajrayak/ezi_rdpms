<!-- @if(loadingService.isLoading('global') | async)  -->
@if ((loadingService.loadingStates$ | async)?.['global']) {
  <div class="d-flex flex-column flex-md-row justify-content-center align-items-center bg-body-inverse opacity-75 text-body-emphasis position-fixed vh-100 vw-100" style="z-index: 1100;">
    <div class="spinner-border" style="width: 3rem; height: 3rem;" role="status"></div>
    <div class="h6 fst-italic m-3">Loading . . .</div>
  </div>
}

<toasts-component aria-live="polite" aria-atomic="true"></toasts-component>

<router-outlet></router-outlet>
