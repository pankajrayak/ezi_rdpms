<ng-template #offcanvasEnd let-offcanvas>
	<div class="offcanvas-header">
		<h4 class="offcanvas-title" id="notification-title">Alert Notification</h4>
		<button type="button" class="btn-close" aria-label="Close" (click)="offcanvas.dismiss('Cross click')"></button>
	</div>
	<div #notification class="offcanvas-body notification-container d-flex flex-column overflow-auto overflow-x-hidden pt-0 pe-1">
        <!-- @if (notifications().length > 0) {
            <div class="mt-auto"></div>
        } -->
		@for (alert of notifications(); track $index; let isFirst = $first;) {
            <div class="notification-block card rounded-3 small border-{{alert.type}} mb-2" [class.mt-auto]="isFirst">
                <div class="card-header bg-{{alert.type}} text-light">Alert</div> 
                <div class="card-body small text-break py-1">
                    {{ alert.message }}
                </div>
            </div>
        }@empty{
            <div class="d-flex flex-column justify-content-center align-items-center h-100">
                <div class="fs-1 fw-bold fst-italic">No Records</div>
            </div>
        }
	</div>
</ng-template>
