<div class="d-flex flex-column h-100">
    
    <!--  Header (Fixed) -->
    <div class="offcanvas-header d-flex flex-column border-bottom border-white border-opacity-25">
        <div class="d-flex justify-content-between align-items-center w-100 mb-3 d-lg-none">
            <h5 class="offcanvas-title text-white">Menu</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
        </div>

        <!-- User Block (Fixed)-->
        <div class="d-flex align-items-center w-100">
            <div class="flex-shrink-0">
                <div class="bg-body-tertiary rounded-circle me-2" style="width: 60px; height: 60px;"></div>
            </div>
            <div class="flex-grow-1">
                <div class="fw-bold text-wrap small mb-0">Manish Kushwaha</div>
                <div class="small text-white-50" style="font-size: 0.75rem;">Administrator</div>
            </div>
        </div>
    </div>
    
    <!-- Navigation (Scrollable) -->
    <div class="sidebar-scroll flex-grow-1 small">
        <div class="sidebar-content p-3 accordion" id="accordionGroup">
            
            <ul class="list-group list-group-flush">

                @for(menu of menus; track menu; let index = $index){
                    <div class="rounded-3 mb-3 overflow-hidden" routerLinkActive="active-mode" #rla="routerLinkActive"
                        [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">

                        @if(!menu.children?.length){
                            <a class="main-menu list-group-item list-group-item-action d-flex justify-content-between align-items-center collapsed" 
                                [routerLink]="[menu.path]" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                <span><i class="bi {{menu.icon}} me-3"></i>{{menu.title}}</span>
                            </a>
                        }@else{
                            <a class="main-menu list-group-item list-group-item-action d-flex justify-content-between align-items-center collapsed" 
                                data-bs-toggle="collapse" [attr.href]="'#collapse-'+index" [attr.aria-expanded]="rla.isActive">
                                <span><i class="bi {{menu.icon}} me-3"></i>{{menu.title}}</span><i class="bi bi-chevron-down small"></i>
                            </a>

                            <div [id]="'collapse-'+index" class="collapse" data-bs-parent="#accordionGroup" [class.show]="rla.isActive">
                                <div class="list-group list-group-flush">

                                    @for(child of menu.children; track child){
                                        <a class="list-group-item list-group-item-action" [routerLink]="child.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                                            <span><i class="bi {{child.icon}} me-3"></i>{{child.title}}</span>
                                        </a>
                                    }

                                </div>
                            </div>
                        }
                    </div>
                }
                
                <!-- Horizontal Fly-out Dropdown -->
                <!-- <div class="dropdown dropend position-static rounded-3 mb-3 overflow-hidden" routerLinkActive="active-mode"
                    [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">
                    
                    <a class="main-menu dropdown-link btn d-flex justify-content-between align-items-center px-3" href="#" data-bs-toggle="dropdown" data-bs-boundary="viewport">
                        <span><i class="bi bi-collection me-3"></i>Asset</span><i class="bi bi-chevron-right small"></i>
                    </a>
                    <ul class="dropdown-menu border-0 shadow">
                        <li><a class="dropdown-item" routerLink="asset/detail-report" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Asset Detail Report</a></li>
                        <li><a class="dropdown-item" routerLink="asset/utilization" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Asset Utilization</a></li>
                    </ul>
                </div> -->
                
            </ul>

        </div>
    </div>

     <!-- Logout Block (Fixed at bottom) -->
    <div class="p-3 border-top border-white border-opacity-25 mt-auto flex-shrink-0">
        <a class="list-group-item list-group-item-action d-flex align-items-center text-warning" routerLink="/login">
            <i class="bi bi-box-arrow-right me-3"></i> <span>Logout</span>
        </a>
    </div>

</div>
