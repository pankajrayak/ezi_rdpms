<div class="d-flex flex-column h-100 border-end bg-body-tertiary text-body" data-bs-theme="dark">
    
    <!-- Header (Fixed) -->
    <div class="offcanvas-header d-flex flex-column flex-shrink-0">
        <!-- Close Button (Mobile Only) -->
        <div class="d-flex justify-content-between align-items-center w-100 mb-3 d-lg-none">
            <h5 class="offcanvas-title text-body">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
        </div>

        <!-- User Block (Fixed) -->
        <div class="d-flex align-items-center w-100">
            <div class="flex-shrink-0">
                <div class="bg-secondary rounded-circle me-2" style="width: 60px; height: 60px;"></div>
            </div>
            <div class="flex-grow-1 small">
                <div class="fw-bold text-body text-wrap mb-0">Manish Kushwaha</div>
                <div class="small text-body-secondary">Administrator</div>
            </div>
        </div>
    </div>
    
    <!-- Navigation (Scrollable via standard BS classes) -->
    <div class="sidebar-scroll flex-grow-1 small p-2 border-bottom border-top">
        <div class="sidebar-content accordion d-flex flex-column gap-2" id="accordionGroup">
            
            @for(menu of menus; track menu; let index = $index){
                <div class="rounded-3 overflow-hidden bg-secondary bg-opacity-25" routerLinkActive="" #rla="routerLinkActive"
                     [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">

                    @if(!menu.children?.length){
                        <!-- Single Menu Item -->
                        <a class="nav-link d-flex justify-content-between align-items-center p-2" [routerLink]="[menu.path]" 
                            routerLinkActive="text-primary fw-semibold" [routerLinkActiveOptions]="{ exact: true }">
                            <span><i class="bi {{menu.icon}} me-3"></i>{{menu.title}}</span>
                        </a>
                    }@else{
                        <!-- Collapsible Menu Item -->
                        <a class="nav-link d-flex justify-content-between align-items-center p-2" [class]="{ 'text-primary': rla.isActive, 'fw-semibold': rla.isActive }"
                           data-bs-toggle="collapse" [attr.href]="'#collapse-'+index" [attr.aria-expanded]="rla.isActive">
                            <span><i class="bi {{menu.icon}} me-3"></i>{{menu.title}}</span>
                            <i class="bi bi-chevron-down small"></i>
                        </a>

                        <!-- Submenu Sublinks Container -->
                        <div [id]="'collapse-'+index" #collapse class="collapse" data-bs-parent="#accordionGroup" [class.show]="rla.isActive">
                            <div class="d-flex flex-column gap-1 small">

                                @for(child of menu.children; track child){
                                    <a class="nav-link p-2 rounded-pill" [routerLink]="child.path" routerLinkActive="bg-primary text-white fw-semibold" [routerLinkActiveOptions]="{ exact: true }">
                                        <span><i class="bi {{child.icon}} me-3"></i>{{child.title}}</span>
                                    </a>
                                }

                            </div>
                        </div>
                    }
                </div>
            }

        </div>
    </div>

    <!-- Logout Block (Fixed at bottom) -->
    <div class="p-2 mt-auto flex-shrink-0">
        <a class="nav-link text-danger fw-semibold d-flex align-items-center p-2" routerLink="/login">
            <i class="bi bi-box-arrow-right me-3"></i> <span>Logout</span>
        </a>
    </div>

</div>
