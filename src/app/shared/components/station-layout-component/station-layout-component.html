<div class="simulation-container">
  <svg [attr.viewBox]="'0 0 ' + simService.canvasWidth + ' ' + simService.canvasHeight"
       width="100%" 
       height="100%" 
       class="railway-svg">
    
    <!-- LAYER 1: Platforms Infrastructure -->
    <g class="platforms-layer">
      @for (track of simService.tracks; track track.id) {
        @if (track.type === 'loop' && track.platformNumber) {
          <rect [attr.x]="(simService.canvasWidth / 2) - 180" 
                [attr.y]="track.y - 25" 
                width="360" 
                height="8" 
                fill="#212529" />
          <text [attr.x]="(simService.canvasWidth / 2) - 45" 
                [attr.y]="track.y - 32" 
                fill="#6c757d" 
                font-size="10" 
                font-weight="bold" 
                font-family="sans-serif">
            PLATFORM {{ track.platformNumber }}
          </text>
        }
      }
    </g>

    <!-- LAYER 2: Track Layout Geometry -->
    <g class="tracks-layer" 
       [attr.stroke-width]="simService.trackLineWidth" 
       stroke-linecap="round" 
       fill="none">
      @for (track of simService.tracks; track track.id) {
        <path [attr.d]="getTrackPath(track)" 
              [attr.stroke]="track.type === 'main' ? '#495057' : '#2b3035'" />
      }
    </g>

    <!-- LAYER 3: Signals Interlocking -->
    <g class="signals-layer">
      <!-- FIXED: Changed track loop parameter to use the native $index fallback context -->
      @for (sig of simService.signals; track $index) {
        @let track = simService.tracks.find(t => t.id === sig.trackId);
        @if (track && !(track.type === 'loop' && (sig.x < 250 || sig.x > 950))) {
          @let computedY = simService.getTrackY(sig.trackId, sig.x);
          
          <rect [attr.x]="sig.x - 3" 
                [attr.y]="computedY - 20" 
                width="6" 
                height="14" 
                fill="#000" />
          
          <circle [attr.cx]="sig.x" 
                  [attr.cy]="computedY - 14" 
                  r="4" 
                  [attr.fill]="getSignalColor(sig.state)" />
        }
      }
    </g>

     <!-- LAYER 4: Dynamic Running Stock -->
    <g class="trains-layer">
      @for (train of simService.trains(); track train.id) {
        <!-- PRE-COMPUTE ALL MUTATING METRICS TO FREEZE LUNAR DIGEST VALUE CLASHES -->
        @let isUpDirection = train.direction === 'up';
        @let labelX = isUpDirection ? (train.x - train.length) : train.x;
        @let labelY = simService.getTrackY(train.currentTrackId, labelX);
        @let cabY = simService.getTrackY(train.currentTrackId, train.x);
        @let formattedSpeed = train.speed.toFixed(1);
        @let staticStopCounter = train.stopCounter;

        <g>
          <!-- Train Ribbon Vector -->
          <path [attr.d]="getTrainPath(train)" 
                [attr.stroke]="train.color" 
                [attr.stroke-width]="simService.trackLineWidth - 4" 
                stroke-linecap="round"
                fill="none" />

          <!-- Lead Cab Indicator -->
          <circle [attr.cx]="train.x" 
                  [attr.cy]="cabY" 
                  r="4" 
                  fill="#ffffff" />

          <!-- Dynamic Telemetry String Labels -->
          <g font-family="sans-serif">
            <text [attr.x]="labelX" 
                  [attr.y]="labelY - 26" 
                  fill="#ffffff" 
                  font-size="10" 
                  font-weight="bold">
              {{ train.name }} ({{ train.status }})
            </text>
            <text [attr.x]="labelX" 
                  [attr.y]="labelY - 14" 
                  fill="#a8dadc" 
                  font-size="9" 
                  font-family="monospace">
              <!-- FIXED: Binds snapshot snapshot variable to prevent mid-cycle checking adjustments -->
              V: {{ formattedSpeed }} | Halt: {{ staticStopCounter }}
            </text>
          </g>
        </g>
      }
    </g>

  </svg>
</div>
